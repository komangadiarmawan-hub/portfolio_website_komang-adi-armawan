    <section class="container mx-auto py-12 px-6">

        <h2 class="text-4xl font-bold text-center mb-10">
            Hubungi Saya
        </h2>

        <div class="bg-white p-8 rounded-xl shadow-lg max-w-xl mx-auto">

                <input type="text"
                    placeholder="Nama"

                    placeholder="Email"
                    class="w-full border p-3 rounded-lg mb-4">

                <textarea
                    placeholder="Pesan"
                    rows="5"
                    class="w-full border p-3 rounded-lg mb-4"></textarea>

                <button
                    class="bg-blue-900 text-white px-6 py-3 rounded-lg hover:bg-blue-700">
